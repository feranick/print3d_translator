<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Printer status</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--fg:#1c1c1a;--muted:#6d6c66;--line:#e2e1db;--track:#ecebe5;--accent:#2f7d4f;
--warn:#b07a00;--bad:#c0392b;--info:#3b6ea5;--shadow:0 1px 2px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141413;--card:#1e1e1c;--fg:#ecebe6;
--muted:#a2a199;--line:#33322e;--track:#2b2b28;--accent:#5fbf86;--warn:#e0b44a;--bad:#ef7468;--info:#86afdc;--shadow:none}}
:root[data-theme=dark]{--bg:#141413;--card:#1e1e1c;--fg:#ecebe6;--muted:#a2a199;--line:#33322e;--track:#2b2b28;
--accent:#5fbf86;--warn:#e0b44a;--bad:#ef7468;--info:#86afdc;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:16px}
h1{font-size:20px;margin:0;font-weight:650}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--track);
font-size:13px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.ok .dot{background:var(--accent)}.warn .dot{background:var(--warn)}.bad .dot{background:var(--bad)}
.conn{color:var(--muted);font-size:13px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:650}
.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}
@media (max-width:820px){.span8,.span6,.span4{grid-column:span 12}}
.big{font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.file{font-weight:600;word-break:break-word}
.bar{height:10px;background:var(--track);border-radius:6px;overflow:hidden;margin:12px 0 10px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .6s}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.row{display:flex;gap:18px;flex-wrap:wrap}
.temp .v{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}
.temp .t{color:var(--muted);font-size:13px}
.fan{display:grid;grid-template-columns:80px 1fr 44px;align-items:center;gap:8px;margin:5px 0}
.fan .bar{margin:0;height:7px}
.trays{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.tray{border:1px solid var(--line);border-radius:10px;padding:10px;position:relative}
.tray.active{outline:2px solid var(--accent);outline-offset:-1px}
.sw{width:100%;height:34px;border-radius:7px;border:1px solid var(--line);margin-bottom:8px}
.tray .lbl{font-weight:650}.tray .sub{color:var(--muted);font-size:12px}
.tray .bar{height:6px;margin:8px 0 2px}
.tag{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;color:var(--accent)}
.amsh{display:flex;gap:14px;color:var(--muted);font-size:13px;margin:0 0 8px}
.err{border-left:3px solid var(--bad);padding:6px 10px;margin:6px 0;background:var(--track);border-radius:6px}
.err code{font:12px ui-monospace,Menlo,monospace}
.none{color:var(--muted)}
.cam img{width:100%;border-radius:8px;display:block;background:var(--track)}
a{color:var(--info)}
footer{color:var(--muted);font-size:12px;margin-top:18px}
</style>
</head>
<body>
<main>
  <header>
    <h1>Printer status</h1>
    <span id="state" class="pill"><span class="dot"></span><span>—</span></span>
    <span id="conn" class="conn">connecting…</span>
  </header>
  <div class="grid">
    <section class="card span8">
      <h2>Print</h2>
      <div class="row" style="align-items:flex-end;justify-content:space-between">
        <div><div class="file" id="file">—</div><div class="none" id="stage"></div></div>
        <div class="big" id="pct">—</div>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <dl class="kv">
        <dt>Layer</dt><dd id="layer">—</dd>
        <dt>Time left</dt><dd id="left">—</dd>
        <dt>Finishes at</dt><dd id="eta">—</dd>
        <dt>Speed</dt><dd id="speed">—</dd>
      </dl>
    </section>
    <section class="card span4">
      <h2>Temperatures</h2>
      <div class="row" id="temps"></div>
      <h2 style="margin-top:14px">Fans</h2>
      <div id="fans"></div>
    </section>
    <section class="card span12">
      <h2>AMS and filaments</h2>
      <div id="ams"></div>
    </section>
    <section class="card span6">
      <h2>Errors</h2>
      <div id="errors"><span class="none">none</span></div>
    </section>
    <section class="card span6 cam">
      <h2>Camera</h2>
      <div id="cam"><span class="none">—</span></div>
    </section>
  </div>
  <footer id="foot">bstat · read-only: this page cannot control the printer</footer>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STATE_CLASS = {printing:"ok", preparing:"ok", finished:"ok", idle:"", paused:"warn", failed:"bad", slicing:"ok"};
function hm(min){ if(min==null) return "—"; const h=Math.floor(min/60), m=min%60; return h? `${h} h ${m} min` : `${m} min`; }
function clock(t){ if(!t) return "—"; const d=new Date(t*1000); return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) +
  (new Date().toDateString()===d.toDateString() ? "" : " (" + d.toLocaleDateString([], {weekday:"short"}) + ")"); }
function ago(t, now){ if(!t) return "never"; const s=Math.max(0,Math.round(now-t)); return s<60? `${s} s ago` : `${Math.round(s/60)} min ago`; }
function temp(name, pair){ const [c,t]=pair||[]; return `<div class="temp"><div class="t">${name}</div><div class="v">${c==null?"—":Math.round(c)+"°"}</div>`+
  `<div class="t">${t? "target "+Math.round(t)+"°" : (c==null?"":"off")}</div></div>`; }
function tray(t){
  if(!t) return "";
  const col = t.color || "transparent", rem = t.remain;
  return `<div class="tray${t.active?" active":""}">${t.active?'<span class="tag">IN USE</span>':""}
    <div class="sw" style="background:${t.empty?"repeating-linear-gradient(45deg,var(--track),var(--track) 6px,transparent 6px,transparent 12px)":esc(col)}"></div>
    <div class="lbl">${esc(t.label||"")} ${t.empty?'<span class="sub">empty</span>':esc(t.type||"")}</div>
    <div class="sub">${t.empty?"&nbsp;":esc(t.brand||"")}</div>
    ${t.empty?"":`<div class="bar"><i style="width:${rem??0}%"></i></div><div class="sub">${rem==null?"remaining unknown":rem+"% left"}</div>`}
  </div>`;
}
function render(s){
  const p=s.printer, c=s.connection, now=s.now;
  const st=$("state"); st.className="pill "+(STATE_CLASS[p.state]??""); st.lastChild.textContent=p.state||"unknown";
  const connText = s.source!=="printer" ? `${s.source}: ${c.detail||""}` :
    c.conn==="connected" ? `connected · last update ${ago(c.last, now)}` : `${c.conn}${c.detail? ": "+c.detail:""}`;
  $("conn").textContent=connText; $("conn").style.color = c.conn==="refused" ? "var(--bad)" : "";
  $("file").textContent=p.file||"no file";
  $("pct").textContent=p.percent==null?"—":p.percent+"%";
  $("bar").style.width=(p.percent||0)+"%";
  $("layer").textContent=p.layer&&p.layer[1]? `${p.layer[0]} of ${p.layer[1]}` : "—";
  $("left").textContent=hm(p.remaining_min);
  $("eta").textContent=clock(p.eta);
  $("speed").textContent=p.speed??"—";
  $("temps").innerHTML=temp("Nozzle",p.temps.nozzle)+temp("Bed",p.temps.bed)+temp("Chamber",[p.temps.chamber,null]);
  $("fans").innerHTML=Object.entries(p.fans).map(([k,v])=>`<div class="fan"><span>${k}</span><div class="bar"><i style="width:${v||0}%"></i></div><span>${v==null?"—":v+"%"}</span></div>`).join("");
  const units=p.ams.units||[];
  let html = units.map(u=>`<div class="amsh"><b style="color:var(--fg)">${esc(u.name)}</b>
     <span>humidity ${u.humidity_pct!=null? Math.round(u.humidity_pct)+"%" : (u.humidity_level!=null? "level "+u.humidity_level+"/5":"—")}</span>
     <span>${u.temp!=null? u.temp.toFixed(1)+"°C":""}</span></div><div class="trays">${u.trays.map(tray).join("")}</div>`).join('<div style="height:12px"></div>');
  if(p.ams.external && !p.ams.external.empty) html += `<div class="amsh" style="margin-top:12px"><b style="color:var(--fg)">External spool</b></div><div class="trays">${tray(p.ams.external)}</div>`;
  $("ams").innerHTML = html || '<span class="none">no AMS reported</span>';
  $("errors").innerHTML = p.errors.length ? p.errors.map(e=>`<div class="err"><div>${e.text?esc(e.text):"Code without a local description"}</div>
     <code>${esc(e.code)}</code> · <a href="${esc(e.link)}" target="_blank" rel="noopener">look it up</a></div>`).join("") : '<span class="none">none</span>';
  const cam=s.camera;
  if(cam.camera==="ok"){ const img=$("camimg"); const src="/camera.jpg?t="+Math.round(cam.time||0);
    if(!img) $("cam").innerHTML=`<img id="camimg" alt="Camera snapshot" src="${src}"><div class="none" id="camt"></div>`;
    else if(img.getAttribute("src")!==src) img.src=src;
    $("camt").textContent="snapshot "+ago(cam.time, now);
  } else $("cam").innerHTML=`<span class="none">${cam.camera==="off"?"off":"not available"}${cam.detail? " — "+esc(cam.detail):""}</span>`;
  $("foot").textContent=`bstat ${s.version} · read-only: this page cannot control the printer`;
  document.title = (p.percent!=null && p.state==="printing" ? p.percent+"% · " : "") + "Printer status";
}
function connect(){
  const es=new EventSource("/events");
  es.onmessage=e=>{ try{ render(JSON.parse(e.data)); }catch(err){ console.error(err); } };
  es.onerror=()=>{ $("conn").textContent="bstat is not running (reconnecting…)"; };
}
connect();
</script>
</body>
</html>
